<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Project · Mission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0F172A;--bg-2:#0B1220;--card:#1B2336;--card-2:#161E2F;--muted:#272F42;
    --muted-fg:#94A3B8;--fg:#F8FAFC;--fg-dim:#CBD5E1;--border:#2A3650;--border-strong:#3A496A;
    --primary:#2563EB;--green:#22C55E;--amber:#F59E0B;--red:#EF4444;--violet:#8B5CF6;
    --radius:14px;--radius-sm:9px;--shadow:0 8px 24px -12px rgba(0,0,0,.6);
    --sans:'Fira Sans',system-ui,sans-serif;--mono:'Fira Code',ui-monospace,monospace;
  }
  *{box-sizing:border-box}html,body{margin:0}
  body{background:radial-gradient(1200px 600px at 80% -10%,rgba(37,99,235,.10),transparent 60%),var(--bg);
    color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:26px 28px 70px}
  .back{display:inline-flex;align-items:center;gap:8px;color:var(--muted-fg);font-size:13px;
    font-family:var(--mono);margin-bottom:20px;transition:color .15s}
  .back:hover{color:var(--fg)}
  .back svg{width:15px;height:15px}

  .phead{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:6px}
  .phead .bar{width:5px;align-self:stretch;border-radius:5px;min-height:54px}
  .phead h1{margin:0;font-size:30px;font-weight:600;letter-spacing:-.4px}
  .phead .id{font-family:var(--mono);font-size:12px;color:var(--muted-fg);margin-top:4px;word-break:break-all}
  .status{font-family:var(--mono);font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;
    display:inline-flex;align-items:center;gap:7px;text-transform:uppercase;letter-spacing:.5px;margin-left:auto}
  .status .dot{width:8px;height:8px;border-radius:50%}
  .s-active{background:rgba(34,197,94,.14);color:#4ADE80}.s-active .dot{background:#22C55E;box-shadow:0 0 8px #22C55E}
  .s-in-progress{background:rgba(37,99,235,.16);color:#60A5FA}.s-in-progress .dot{background:#3B82F6}
  .s-blocked{background:rgba(239,68,68,.14);color:#F87171}.s-blocked .dot{background:#EF4444}
  .s-idle{background:rgba(100,116,139,.16);color:#94A3B8}.s-idle .dot{background:#64748B}
  .s-archived{background:rgba(100,116,139,.10);color:#64748B}.s-archived .dot{background:#475569}

  .tags{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 4px}
  .tag{font-size:11px;font-family:var(--mono);color:var(--muted-fg);background:var(--muted);padding:3px 9px;border-radius:6px}
  .techrow{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 4px;padding-left:23px;align-items:center}
  .techrow .tlabel{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-family:var(--mono);
    text-transform:uppercase;letter-spacing:.5px;color:var(--muted-fg)}
  .techrow .tlabel svg{width:13px;height:13px}
  .tch{font-size:12px;font-family:var(--mono);color:#7DD3FC;background:rgba(14,165,233,.1);
    border:1px solid rgba(14,165,233,.28);padding:3px 10px;border-radius:6px}

  .nextbox{display:flex;align-items:center;gap:13px;background:linear-gradient(180deg,var(--card),var(--card-2));
    border:1px solid var(--border);border-left:3px solid var(--green);border-radius:var(--radius);
    padding:15px 18px;margin:18px 0 24px;box-shadow:var(--shadow)}
  .nextbox .ic{width:32px;height:32px;border-radius:8px;background:rgba(34,197,94,.14);color:var(--green);
    display:grid;place-items:center;flex:none}
  .nextbox .ic svg{width:17px;height:17px}
  .nextbox .lab{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted-fg)}
  .nextbox .txt{font-size:15px;font-weight:500}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:24px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow)}
  .stat .l{font-size:12px;color:var(--muted-fg)}
  .stat .v{font-family:var(--mono);font-size:24px;font-weight:600;margin-top:4px}
  .stat .v.green{color:var(--green)}.stat .v.amber{color:var(--amber)}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px}
  .panel .ph{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
  .panel .ph h2{font-size:14px;margin:0;font-weight:600;display:flex;align-items:center;gap:9px}
  .panel .ph h2 svg{width:16px;height:16px;color:var(--muted-fg)}
  .panel .ph .meta{font-family:var(--mono);font-size:12px;color:var(--muted-fg)}
  .pb{padding:8px 18px 16px}

  .ms{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--border)}
  .ms:last-child{border-bottom:none}
  .ms .box{width:19px;height:19px;border-radius:6px;border:2px solid var(--border-strong);flex:none;display:grid;place-items:center}
  .ms.done .box{background:var(--green);border-color:var(--green)}
  .ms.done .box svg{width:12px;height:12px;color:#06210F}
  .ms .box svg{display:none}.ms.done .box svg{display:block}
  .ms.done .label{color:var(--muted-fg);text-decoration:line-through}
  .ms .label{font-size:14px}

  .todo{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-bottom:1px solid var(--border)}
  .todo:last-child{border-bottom:none}
  .todo .d{width:7px;height:7px;border-radius:50%;background:var(--amber);margin-top:7px;flex:none}
  .todo .label{font-size:14px}

  .mem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:13px}
  .mem:last-child{border-bottom:none}
  .mem svg{width:15px;height:15px;color:var(--violet);flex:none}
  /* Memory docs (with excerpts) */
  .memdoc{padding:10px 0;border-bottom:1px solid var(--border)}
  .memdoc:last-child{border-bottom:none}
  .memdoc .md-h{display:flex;align-items:center;gap:8px;font-size:13px}
  .memdoc .md-h svg{width:15px;height:15px;color:var(--violet);flex:none}
  .memdoc .md-f{font-family:var(--mono);font-size:11px;color:var(--muted-fg);margin:2px 0 0 23px}
  .memdoc .md-x{font-size:12.5px;color:var(--fg-dim);line-height:1.55;margin:5px 0 0 23px}
  /* Pending changes panel */
  .pcsub{display:flex;align-items:center;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--muted-fg);font-weight:600;margin:6px 0 8px}
  .pcsub svg{width:14px;height:14px}
  .pcsub .n{margin-left:auto;font-family:var(--mono);color:var(--fg-dim)}
  .pcrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:12.5px}
  .pcrow:last-child{border-bottom:none}
  .pcrow .code{flex:none;width:24px;text-align:center;font-weight:700;border-radius:4px;padding:2px 0;font-size:11px}
  .pcrow .code.m{color:var(--amber);background:rgba(245,158,11,.13)}
  .pcrow .code.a{color:var(--green);background:rgba(34,197,94,.13)}
  .pcrow .code.d{color:var(--red);background:rgba(239,68,68,.13)}
  .pcrow .code.u{color:var(--primary);background:rgba(37,99,235,.16)}
  .pcrow .path{word-break:break-all;color:var(--fg)}
  .pcrow .hash{flex:none;color:var(--violet)}
  .pcrow .subj{color:var(--fg);word-break:break-word;font-family:inherit}
  .pcmore{font-size:11px;color:var(--muted-fg);padding:8px 0 2px;font-style:italic}
  .pcgap{height:14px}
  /* Branches sub-list (Repository panel) */
  .brsub{display:flex;align-items:center;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--muted-fg);font-weight:600;margin:14px 0 8px;border-top:1px solid var(--border);padding-top:14px}
  .brsub .brn{margin-left:auto;font-family:var(--mono);color:var(--fg-dim)}
  .brrow{display:flex;align-items:center;gap:10px;padding:5px 0;font-family:var(--mono);font-size:13px}
  .brdot{width:8px;height:8px;border-radius:50%;flex:none}
  .brname{word-break:break-all}
  .brcur{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#4ADE80;background:rgba(34,197,94,.14);padding:2px 7px;border-radius:6px}
  .brgone{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#94A3B8;background:var(--muted);padding:2px 7px;border-radius:6px}
  .brdate{margin-left:auto;color:var(--muted-fg);font-size:12px}
  /* Knowledge base panel */
  .ksub{display:flex;align-items:center;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--muted-fg);font-weight:600;margin:4px 0 10px}
  .ksub svg{width:14px;height:14px}
  .kentry{border-left:2px solid var(--violet);padding:2px 0 12px 14px;margin-bottom:12px}
  .kentry:last-child{margin-bottom:0}
  .kentry .khead{display:flex;align-items:baseline;gap:10px;margin-bottom:2px}
  .kentry .kdate{font-family:var(--mono);font-size:11px;color:var(--violet);flex:none}
  .kentry .ktitle{font-weight:600;font-size:13.5px}
  .kbody{font-size:13px;color:var(--fg-dim);line-height:1.6}
  .kbody ul{margin:6px 0;padding-left:20px}
  .kbody li{margin:3px 0}
  .kbody p{margin:6px 0}
  .kbody code{font-family:var(--mono);font-size:12px;background:var(--muted);padding:1px 5px;border-radius:4px}
  .kbody h1,.kbody h2,.kbody h3{font-size:13.5px;margin:10px 0 4px}
  .kbody table{border-collapse:collapse;margin:8px 0;font-size:12px}
  .kbody th,.kbody td{border:1px solid var(--border);padding:4px 9px;text-align:left}
  .kbody pre{background:#0a1628;border:1px solid var(--border);border-radius:6px;padding:10px;overflow-x:auto;font-size:11.5px}
  .mdraw{white-space:pre-wrap;font-family:var(--mono);font-size:12px;color:var(--fg-dim);margin:0}
  /* Featured architecture spec (collapsible) */
  .kspec{border:1px solid var(--border);border-radius:8px;background:rgba(245,158,11,.04);padding:10px 14px;margin-bottom:14px}
  .kspec>summary{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;list-style:none}
  .kspec>summary::-webkit-details-marker{display:none}
  .kspec>summary .ksub{color:#FBBF24}
  .kspec>summary .ksub svg{color:#FBBF24}
  .kspec .kspec-f{font-family:var(--mono);font-size:11px;color:var(--muted-fg);flex:none}
  .kspec-body{margin-top:10px;border-top:1px solid var(--border);padding-top:10px;max-height:520px;overflow-y:auto}
  .knote{padding:9px 0;border-bottom:1px solid var(--border)}
  .knote:last-child{border-bottom:none}
  .knote .kn-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .knote .kn-h b{font-size:13px}
  .knote .kn-f{font-family:var(--mono);font-size:11px;color:var(--muted-fg);flex:none}
  .knote .kn-x{font-size:12.5px;color:var(--fg-dim);line-height:1.5;margin-top:4px}
  .skl{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
  .skl:last-child{border-bottom:none}
  .skl .ic{flex:none;display:inline-flex}.skl .ic svg{width:15px;height:15px;color:var(--violet)}
  .skl.agt .ic svg{color:#60A5FA}
  .skl .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
  .skl .txt b{font-family:var(--mono);font-size:13px;font-weight:600}
  .skl .txt .ds{font-size:12px;color:var(--muted-fg);line-height:1.4}
  .cywrap{position:relative;background:#0a1628;border:1px solid var(--border);border-radius:10px;overflow:hidden}
  #cy{height:540px;width:100%}
  .cy-ctrl{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:5}
  .cy-ctrl button{font-family:var(--mono);font-size:13px;color:var(--fg);background:var(--card-2);border:1px solid var(--border);border-radius:7px;width:30px;height:30px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
  .cy-ctrl button[data-act="fit"]{width:auto;padding:0 10px}
  .cy-ctrl button:hover{border-color:#2563EB;color:#60A5FA}
  .cy-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-family:var(--mono);font-size:12px;color:var(--muted-fg)}
  .cy-legend .lg{display:inline-flex;align-items:center;gap:6px}
  .cy-legend .sw{width:20px;height:0;border-top:2px solid currentColor}
  .tree{font-family:var(--mono)}
  .trow{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;min-width:0}
  .trow.d1{padding-left:24px}
  .trow .ti{flex:none;display:inline-flex;width:15px}
  .trow .ti svg{width:15px;height:15px}
  .trow.d0 .ti svg{color:#60A5FA}
  .trow.d1 .ti svg{color:var(--muted-fg)}
  .trow .tn{color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .trow.d1 .tn{color:var(--muted-fg)}
  .trow.more .tn{color:var(--muted-fg);font-style:italic;font-size:12px}
  .trow .tc{font-size:10px;color:var(--muted-fg);background:var(--card-2);border:1px solid var(--border);
    padding:0 5px;border-radius:5px;margin-left:2px}

  .summary{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 20px;box-shadow:var(--shadow);margin-bottom:20px;color:var(--fg-dim);line-height:1.65}
  .summary h2{font-size:14px;margin:0 0 10px;color:var(--fg);display:flex;align-items:center;gap:9px}
  .summary h2 svg{width:16px;height:16px;color:var(--muted-fg)}

  .progress .bar{height:8px;border-radius:8px;background:var(--muted);overflow:hidden}
  .progress .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#16A34A)}
  .progress .lbl{font-size:12px;color:var(--muted-fg);font-family:var(--mono);margin-top:7px;display:flex;justify-content:space-between}

  .gline{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
  .gline:last-child{border-bottom:none}
  .gline .k{color:var(--muted-fg)}
  .gline .v{font-family:var(--mono);text-align:right}
  .empty code{font-family:var(--mono);background:rgba(0,0,0,.25);padding:1px 6px;border-radius:5px;color:var(--fg-dim)}
  .empty{padding:20px 6px;color:var(--muted-fg);font-size:13px;text-align:center}
  .hint{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);border-radius:var(--radius);
    padding:14px 16px;color:#FCD34D;font-size:13px;margin-bottom:20px;line-height:1.5}
  .hint code{font-family:var(--mono);background:rgba(0,0,0,.25);padding:1px 6px;border-radius:5px}
  @media (max-width:820px){.cols{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="data.js"></script>
<script>
const D=window.MISSION_CONTROL||{projects:[]};
const params=new URLSearchParams(location.search);
const id=params.get('id');
const FLOW={
  read:{color:'#60A5FA',label:'Request / read'},
  control:{color:'#F59E0B',label:'Control'},
  data:{color:'#22C55E',label:'Data / media'},
  write:{color:'#A78BFA',label:'Write'},
  feedback:{color:'#F472B6',label:'Feedback'},
  async:{color:'#94A3B8',label:'Async / future'}
};
const KIND_BORDER={client:'#60A5FA',edge:'#22D3EE',service:'#2563EB',core:'#F59E0B',store:'#22D3EE',external:'#A78BFA'};
const p=(D.projects||[]).find(x=>x.id===id);
const SL={active:'Active','in-progress':'In progress',blocked:'Blocked',idle:'Idle',archived:'Archived'};
const SC={active:'#22C55E','in-progress':'#3B82F6',blocked:'#EF4444',idle:'#64748B',archived:'#475569'};
const I={
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 7"/></svg>',
  flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 22V4h13l-2 4 2 4H4"/></svg>',
  todo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>',
  mem:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 4v16M4 9h5M4 15h5"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  git:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="9" r="2.5"/><path d="M6 8.5v7M18 11.5c0 3-3 3.5-6 3.5"/></svg>',
  skill:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.4 5.4L20 8.2l-4 4 1 5.8-5-2.8-5 2.8 1-5.8-4-4 5.6-.8z"/></svg>',
  agent:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="8" width="16" height="11" rx="2"/><path d="M12 8V4M9 13h.01M15 13h.01"/></svg>',
  tree:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="15" width="6" height="6" rx="1"/><path d="M6 9v6a2 2 0 0 0 2 2h7M6 13h6"/></svg>',
  fold:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h6l2 2h10v9a2 2 0 0 1-2 2H3z"/></svg>',
  file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
  spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z"/></svg>',
  layers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  journal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h13a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H3z"/><path d="M18 2v4"/><path d="M7 8h7M7 12h7M7 16h4"/></svg>',
  upload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M12 16V4M7 9l5-5 5 5"/></svg>',
};
const root=document.getElementById('root');

if(!p){
  root.innerHTML=`<a class="back" href="index.html">${I.back} Back to overview</a>
    <div class="empty">Project not found. <a style="color:#60A5FA" href="index.html">Return to dashboard</a>.</div>`;
}else{
  const ms=p.milestones||[],done=ms.filter(m=>m.done).length,pct=ms.length?Math.round(done/ms.length*100):0;
  const todos=p.todos||[],mem=p.memory||[],g=p.git,skills=p.skills||[],agents=p.agents||[],tree=p.tree||[],arch=p.arch||null;
  const techStack=p.techStack||[],cl=p.claude||null;
  const knowledge=p.knowledge||null,memoryDocs=p.memoryDocs||[];
  const fmtTok=n=>{n=n||0;if(n>=1e9)return (n/1e9).toFixed(2)+'B';if(n>=1e6)return (n/1e6).toFixed(1)+'M';if(n>=1e3)return (n/1e3).toFixed(1)+'K';return ''+n;};
  const fmtUSD=n=>'$'+(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // Render markdown via marked if loaded; otherwise fall back to escaped <pre>.
  const md=s=>{const t=s||'';if(window.marked&&t.trim()){try{return marked.parse(t);}catch(e){}}return '<pre class="mdraw">'+esc(t)+'</pre>';};
  const topCount=tree.filter(t=>t.depth===0&&!t.more).length;
  root.innerHTML=`
    <a class="back" href="index.html">${I.back} Back to overview</a>
    <div class="phead">
      <span class="bar" style="background:${SC[p.status]}"></span>
      <div>
        <h1>${p.name}</h1>
        <div class="id">${p.id}</div>
      </div>
      <span class="status s-${p.status}"><span class="dot"></span>${SL[p.status]||p.status}</span>
    </div>
    ${p.stack?`<div style="color:var(--muted-fg);font-size:13px;font-family:var(--mono);padding-left:23px">${p.stack}</div>`:''}
    ${techStack.length?`<div class="techrow"><span class="tlabel">${I.layers} tech stack</span>${techStack.map(t=>`<span class="tch">${t.replace(/</g,'&lt;')}</span>`).join('')}</div>`:''}
    ${p.tags&&p.tags.length?`<div class="tags" style="padding-left:23px">${p.tags.map(t=>`<span class="tag">#${t}</span>`).join('')}</div>`:''}

    ${p.next?`<div class="nextbox"><span class="ic">${I.arrow}</span>
      <div><div class="lab">Next action</div><div class="txt">${p.next}</div></div></div>`:''}

    <div class="stats">
      <div class="stat"><div class="l">Sessions</div><div class="v">${p.sessions}</div></div>
      <div class="stat"><div class="l">Milestones</div><div class="v green">${done}/${ms.length||0}</div></div>
      <div class="stat"><div class="l">Open todos</div><div class="v amber">${todos.length}</div></div>
      <div class="stat"><div class="l">Last active</div><div class="v" style="font-size:16px">${p.lastActive||'—'}</div></div>
    </div>

    ${p.summary?`<div class="summary"><h2>${I.info} Summary</h2>${p.summary.replace(/</g,'&lt;')}</div>`:''}

    ${!p.hasNote?`<div class="hint">No <code>mission-control.md</code> note for this project yet — showing derived data only.
      Run <code>/update</code> at the end of a session, or add a note in this project's folder to track status, milestones &amp; todos.</div>`:''}

    ${knowledge?`<section class="panel">
      <div class="ph"><h2>${I.book} Knowledge base</h2><span class="meta">knowledge/ · ${knowledge.spec?'spec · ':''}${knowledge.journal.length} journal · ${knowledge.notes.length} notes</span></div>
      <div class="pb">
        ${knowledge.spec?`<details class="kspec" open>
          <summary><span class="ksub" style="margin:0">${I.layers} Architecture spec</span><span class="kspec-f">${esc(knowledge.spec.name)} · ${knowledge.spec.words} words</span></summary>
          <div class="kbody kspec-body">${md(knowledge.spec.body)}</div>
        </details>`:''}
        ${knowledge.journal.length?`<div class="ksub"${knowledge.spec?' style="margin-top:16px"':''}>${I.journal} Session journal</div>
          ${knowledge.journal.map(e=>`<div class="kentry">
            <div class="khead">${e.date?`<span class="kdate">${esc(e.date)}</span>`:''}<span class="ktitle">${esc((e.title||'').replace(/^\d{4}-\d{2}-\d{2}\s*[—-]?\s*/,''))||'Entry'}</span></div>
            <div class="kbody">${md(e.body)}</div></div>`).join('')}`:''}
        ${knowledge.notes.length?`<div class="ksub" style="margin-top:14px">${I.doc} Notes</div>
          ${knowledge.notes.map(n=>`<div class="knote"><div class="kn-h"><b>${esc(n.title)}</b><span class="kn-f">${esc(n.name)} · ${n.words} words</span></div>${n.excerpt?`<div class="kn-x">${esc(n.excerpt)}</div>`:''}</div>`).join('')}`:''}
        ${(!knowledge.journal.length&&!knowledge.notes.length&&!knowledge.spec)?`<div class="empty">knowledge/ folder is empty — add a journal.md or notes</div>`:''}
      </div>
    </section>`:''}

    <div class="cols">
      <div>
        <section class="panel">
          <div class="ph"><h2>${I.flag} Milestones</h2><span class="meta">${pct}%</span></div>
          <div class="pb">
            ${ms.length?`<div class="progress" style="margin:8px 0 14px"><div class="bar"><i style="width:${pct}%"></i></div>
              <div class="lbl"><span>${done} done</span><span>${ms.length-done} remaining</span></div></div>`+
              ms.map(m=>`<div class="ms ${m.done?'done':''}"><span class="box">${I.check}</span><span class="label">${m.label}</span></div>`).join('')
              :`<div class="empty">No milestones yet</div>`}
          </div>
        </section>
        <section class="panel">
          <div class="ph"><h2>${I.mem} Memory files</h2><span class="meta">${(memoryDocs.length||mem.length)}</span></div>
          <div class="pb">
            ${memoryDocs.length?memoryDocs.map(m=>`<div class="memdoc"><div class="md-h">${I.doc} <b>${esc(m.title||m.name)}</b></div><div class="md-f">${esc(m.name)}</div>${m.excerpt?`<div class="md-x">${esc(m.excerpt)}</div>`:''}</div>`).join('')
              :mem.length?mem.map(m=>`<div class="mem">${I.doc} ${esc(m)}</div>`).join('')
              :`<div class="empty">No memory files</div>`}
          </div>
        </section>
        <section class="panel">
          <div class="ph"><h2>${I.skill} Skills &amp; agents</h2><span class="meta">${skills.length+agents.length}</span></div>
          <div class="pb">
            ${skills.length?skills.map(s=>`<div class="skl"><span class="ic">${I.skill}</span><div class="txt"><b>${s.name}</b>${s.description?`<span class="ds">${s.description.replace(/</g,'&lt;')}</span>`:''}</div></div>`).join(''):''}
            ${agents.length?agents.map(a=>`<div class="skl agt"><span class="ic">${I.agent}</span><div class="txt"><b>${a.name}</b><span class="ds">agent</span></div></div>`).join(''):''}
            ${(!skills.length&&!agents.length)?`<div class="empty">No project-local skills or agents</div>`:''}
          </div>
        </section>
      </div>
      <div>
        <section class="panel">
          <div class="ph"><h2>${I.todo} Todos</h2><span class="meta">${todos.length} open</span></div>
          <div class="pb">
            ${todos.length?todos.map(t=>`<div class="todo"><span class="d"></span><span class="label">${t}</span></div>`).join(''):`<div class="empty">Inbox zero — no open todos</div>`}
          </div>
        </section>
        <section class="panel">
          <div class="ph"><h2>${I.git} Repository</h2><span class="meta">${g?(g.branch||'detached'):'—'}</span></div>
          <div class="pb">
            ${g?`
              <div class="gline"><span class="k">Status</span>
                <span class="v">${g.dirty?`<b style="color:#FBBF24">${g.dirty} uncommitted</b>`:`<b style="color:#4ADE80">clean</b>`}</span></div>
              ${(typeof g.behind==='number')?`<div class="gline"><span class="k">Sync</span><span class="v">↑${g.ahead} ahead · ↓${g.behind} behind</span></div>`:''}
              <div class="gline"><span class="k">Commits (30d)</span><span class="v">${g.commits30d||0}</span></div>
              ${g.lastCommitDate?`<div class="gline"><span class="k">Last commit</span><span class="v">${g.lastCommitDate}</span></div>`:''}
              ${g.lastCommitMsg?`<div class="gline"><span class="k">Message</span><span class="v" style="max-width:60%">${g.lastCommitMsg.replace(/</g,'&lt;')}</span></div>`:''}
              ${g.remote?`<div class="gline"><span class="k">Remote</span><span class="v" style="word-break:break-all;max-width:60%">${g.remote.replace(/</g,'&lt;')}</span></div>`:''}
              ${(g.branches&&g.branches.length)?`<div class="brsub">Local branches<span class="brn">${g.branches.length}</span></div>
              ${g.branches.map(b=>`<div class="brrow"><span class="brdot" style="background:${b.name===g.branch?'#22C55E':'#3A496A'}"></span><span class="brname" style="color:${b.name===g.branch?'#F8FAFC':'#CBD5E1'}">${esc(b.name)}</span>${b.name===g.branch?'<span class="brcur">current</span>':(b.upstream?'':'<span class="brgone">local-only</span>')}${b.date?`<span class="brdate">${b.date}</span>`:''}</div>`).join('')}`:''}
            `:`<div class="empty">Not a git repo yet — initialize with <code>git init</code> to track activity here.</div>`}
          </div>
        </section>
        ${g?(()=>{
          const files=g.dirtyFiles||[], commits=g.unpushedCommits||[];
          const codeClass=c=>{const x=(c||'').toUpperCase();
            if(x.includes('?'))return'u'; if(x.includes('D'))return'd';
            if(x.includes('A'))return'a'; return'm';};
          const total=(g.dirty||files.length)+(g.ahead||commits.length);
          return `<section class="panel">
          <div class="ph"><h2>${I.upload} Pending changes</h2><span class="meta">${total?`${g.dirty||0} uncommitted · ${g.ahead||0} unpushed`:'in sync'}</span></div>
          <div class="pb">
            ${(!files.length&&!commits.length)?`<div class="empty">${g.remote?'All committed &amp; pushed — nothing staged for the next version.':'Nothing uncommitted. Add a remote to track unpushed commits.'}</div>`:''}
            ${files.length?`<div class="pcsub">${I.git} Uncommitted <span class="n">${g.dirty||files.length}</span></div>
              ${files.map(f=>`<div class="pcrow"><span class="code ${codeClass(f.code)}">${esc(f.code)}</span><span class="path">${esc(f.path)}</span></div>`).join('')}
              ${(g.dirty||0)>files.length?`<div class="pcmore">+ ${(g.dirty||0)-files.length} more not shown</div>`:''}`:''}
            ${(files.length&&commits.length)?`<div class="pcgap"></div>`:''}
            ${commits.length?`<div class="pcsub">${I.upload} Unpushed to ${g.remote?'origin':'remote'} <span class="n">${g.ahead||commits.length}</span></div>
              ${commits.map(c=>`<div class="pcrow"><span class="hash">${esc(c.hash)}</span><span class="subj">${esc(c.subject)}</span></div>`).join('')}
              ${(g.ahead||0)>commits.length?`<div class="pcmore">+ ${(g.ahead||0)-commits.length} more not shown</div>`:''}`:''}
          </div>
        </section>`;})():''}
        <section class="panel">
          <div class="ph"><h2>${I.spark} Claude Code usage</h2><span class="meta">${cl?'est.':'—'}</span></div>
          <div class="pb">
            ${cl?`
              <div class="gline"><span class="k">Est. spend</span><span class="v"><b style="color:#FBBF24">${fmtUSD(cl.cost)}</b></span></div>
              <div class="gline"><span class="k">Total tokens</span><span class="v">${fmtTok(cl.tokens)}</span></div>
              <div class="gline"><span class="k">Input · Output</span><span class="v">${fmtTok(cl.input)} · ${fmtTok(cl.output)}</span></div>
              <div class="gline"><span class="k">Cache read · write</span><span class="v">${fmtTok(cl.cacheRead)} · ${fmtTok(cl.cacheWrite)}</span></div>
              <div class="gline"><span class="k">Messages</span><span class="v">${(cl.messages||0).toLocaleString()}</span></div>
            `:`<div class="empty">No Claude Code sessions recorded for this project yet.</div>`}
          </div>
        </section>
      </div>
    </div>

    ${arch?`<section class="panel">
      <div class="ph"><h2>${I.tree} Tech architecture</h2><span class="meta">interactive · drag · zoom</span></div>
      <div class="pb">
        <div class="cywrap">
          <div class="cy-ctrl">
            <button data-act="fit" title="Fit to view">Fit</button>
            <button data-act="in" title="Zoom in">+</button>
            <button data-act="out" title="Zoom out">−</button>
          </div>
          <div id="cy"></div>
        </div>
        <div class="cy-legend" id="cy-legend"></div>
      </div>
    </section>`:''}

    <section class="panel">
      <div class="ph"><h2>${I.tree} Project structure</h2><span class="meta">${topCount} top-level</span></div>
      <div class="pb">
        ${tree.length?`<div class="tree">${tree.map(t=>`
          <div class="trow d${t.depth}${t.more?' more':''}">
            <span class="ti">${t.more?'':(t.dir?I.fold:I.file)}</span>
            <span class="tn">${(t.name||'').replace(/</g,'&lt;')}${t.dir&&t.count?` <span class="tc">${t.count}</span>`:''}</span>
          </div>`).join('')}</div>`
        :`<div class="empty">Empty project folder</div>`}
      </div>
    </section>
  `;
  document.title=p.name+' · Mission Control';
  if(arch) renderArch(arch);
}

function renderArch(g){
  if(typeof cytoscape==='undefined'){ document.getElementById('cy').innerHTML='<div class="empty" style="padding:20px">Diagram library failed to load (offline?).</div>'; return; }
  const tiers=g.tiers||[], nodes=g.nodes||[], edges=g.edges||[];
  const els=[];
  const TID=id=>'__t_'+id;  // namespace tier ids so a node id can safely match a tier id
  tiers.forEach(t=>els.push({data:{id:TID(t.id),label:t.label,_tier:true}}));
  nodes.forEach(n=>els.push({data:{id:n.id,label:n.label,parent:n.tier?TID(n.tier):undefined,kind:n.kind||'service'}}));
  edges.forEach((e,i)=>els.push({data:{id:'e'+i,source:e.source,target:e.target,label:e.label||''},classes:(e.flow||'read')+(e.dashed?' dashed':'')}));

  const flowStyles=Object.keys(FLOW).map(f=>({selector:'edge.'+f,style:{'line-color':FLOW[f].color,'target-arrow-color':FLOW[f].color}}));

  const cy=cytoscape({
    container:document.getElementById('cy'),
    elements:els,
    style:[
      {selector:'node[!_tier]',style:{
        'background-color':'#1B2336','border-width':2,
        'border-color':ele=>KIND_BORDER[ele.data('kind')]||'#2563EB',
        'label':'data(label)','color':'#E2E8F0','font-family':'Fira Sans, sans-serif','font-size':13,'font-weight':600,
        'text-valign':'center','text-halign':'center','text-wrap':'wrap','text-max-width':136,
        'shape':'round-rectangle','width':164,'height':50
      }},
      {selector:'node[?_tier]',style:{
        'background-color':'#0e2238','background-opacity':0.35,'border-width':1,'border-style':'dashed','border-color':'#0ea5e9',
        'label':'data(label)','color':'#7dd3fc','font-family':'Fira Code, monospace','font-size':11,'font-weight':600,
        'text-valign':'top','text-halign':'left','text-margin-x':10,'text-margin-y':14,'shape':'round-rectangle','padding':'16px'
      }},
      {selector:'edge',style:{
        'width':2,'curve-style':'bezier','line-color':'#60A5FA','target-arrow-color':'#60A5FA','target-arrow-shape':'triangle','arrow-scale':1,
        'label':'data(label)','font-family':'Fira Code, monospace','font-size':10,'color':'#94A3B8','text-background-color':'#0a1628','text-background-opacity':1,'text-background-padding':3
      }},
      {selector:'edge.dashed',style:{'line-style':'dashed','target-arrow-shape':'triangle'}},
      ...flowStyles
    ],
    layout:{name:'dagre',rankDir:'TB',nodeSep:38,rankSep:64,padding:24}
  });
  cy.userZoomingEnabled(false);
  cy.fit(undefined,24);

  const root=document.getElementById('root');
  root.querySelector('[data-act="fit"]').onclick=()=>cy.fit(undefined,24);
  root.querySelector('[data-act="in"]').onclick=()=>cy.zoom({level:cy.zoom()*1.25,renderedPosition:{x:cy.width()/2,y:cy.height()/2}});
  root.querySelector('[data-act="out"]').onclick=()=>cy.zoom({level:cy.zoom()/1.25,renderedPosition:{x:cy.width()/2,y:cy.height()/2}});

  const used=[...new Set(edges.map(e=>e.flow||'read'))];
  document.getElementById('cy-legend').innerHTML=used.map(f=>`<span class="lg" style="color:${(FLOW[f]||FLOW.read).color}"><span class="sw"></span><span style="color:var(--muted-fg)">${(FLOW[f]||FLOW.read).label}</span></span>`).join('');
}
</script>
</body>
</html>
